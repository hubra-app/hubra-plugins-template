name: Test and release

# Tests every push and pull request; a pushed v* tag that matches plugin.yaml
# (v1.3.0 for version 1.3.0) is also signed and released:
#
#     git tag v1.3.0 && git push origin v1.3.0
#
# The steps live in hubra-app/hubra-plugins-template, .github/workflows/
# plugin.yml, which describes them and the secrets. Every plugin calls the same
# file, pinned to a commit, so the checks and the signing are the same
# everywhere; move the pin to take a newer version. Only the template itself
# calls its own copy (./.github/workflows/plugin.yml), so a change to it is
# tested in its own pull request. A plugin made from the template points
# `uses:` at hubra-app/hubra-plugins-template instead, as in the README.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    uses: ./.github/workflows/plugin.yml
    permissions:
      contents: write # only the release job uses it, on a tag
    secrets:
      HUBRA_READ_TOKEN: ${{ secrets.HUBRA_READ_TOKEN }}
      MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}

  # The check branch protection requires. The jobs of a called workflow
  # report as "plugin / test" and so on; this one keeps the name "test" and
  # passes only when they all passed or, off a tag, were skipped.
  test:
    needs: plugin
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.plugin.result }}
        run: |
          echo "plugin: $RESULT"
          [ "$RESULT" = success ]
