name: Plugin

# The whole pipeline of an official plugin, called by each plugin's
# .github/workflows/release.yml, so every plugin runs the same checks and
# signs the same way. A change here reaches a plugin when its release.yml
# points at the new commit.
#
# Every push and pull request runs the plugin's tests and type check against
# Hubra's main.
#
# Push a tag that matches plugin.yaml (v1.3.0 for version 1.3.0) and the
# plugin is tested, signed and published as a GitHub release with
# <id>-<version>.zip and <id>-<version>.zip.sha256 attached:
#
#     git tag v1.3.0 && git push origin v1.3.0
#
# The release is created only once everything is ready, so it works with
# immutable releases (Settings > General > Releases), which keep a published
# zip from ever being swapped. Its description is that version's CHANGELOG.md
# section and the zip's SHA-256. A draft release you made for the tag in
# advance is filled and published instead, keeping what you wrote in it. A
# release that is already published is never touched: tag a new version.
# Files listed in .releaseignore stay out of the zip. The Marketplace
# (hubra-app/hubra-plugins) picks the release up.
#
# The signing key is the most sensitive secret here: anything it signs
# installs as "official" on every Hubra server. So only the sign job sees it,
# in the GitHub environment "plugin-signing" of the plugin's repository, and
# that job runs no npm and no third-party action, only the plugin from git,
# Hubra's backend and its locked Python packages. From the jobs before it, it
# takes just the built frontend (frontend/dist). The key never passes through
# the caller: an environment secret is read by the job that names the
# environment.
#   test     no signing key: tests, type check, and on a tag the frontend build
#   sign     environment "plugin-signing": signs and packs
#   release  contents: write, no signing key: publishes the release with the zip
#
# Secrets, all in the plugin's repository:
#   HUBRA_SIGNING_KEY   an environment secret of "plugin-signing" (not an
#                       organisation or repository secret, which every job
#                       could read): the private key (PEM) of Hubra.pub. Add
#                       yourself as required reviewer of the environment, so
#                       every signing run waits for a click.
#   HUBRA_READ_TOKEN    only while hubra-app/hubra is private: a token that can
#                       read it (Contents: read); passed by the caller
#   MARKETPLACE_TOKEN   optional: Actions write on the Marketplace repository,
#                       so it publishes right away instead of within the hour;
#                       passed by the caller
on:
  workflow_call:
    secrets:
      HUBRA_READ_TOKEN:
        required: false
      MARKETPLACE_TOKEN:
        required: false
      # Never passed by the caller: the sign job names the environment
      # plugin-signing, and GitHub then reads the environment's secret.
      # Declared only so the name is known here.
      HUBRA_SIGNING_KEY:
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.manifest.outputs.id }}
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
      - name: Check the tag against plugin.yaml
        id: manifest
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 - <<'PY'
          import os, re
          text = open("plugin/plugin.yaml").read()
          pid = re.search(r"^id:\s*[\"']?([\w-]+)", text, re.M).group(1)
          ver = re.search(r"^version:\s*[\"']?([^\"'\s]+)", text, re.M).group(1)
          tag = os.environ["TAG"]
          if tag and tag != f"v{ver}":
              raise SystemExit(f"::error::tag {tag}, but plugin.yaml says version {ver}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"id={pid}\nversion={ver}\n")
          PY
      # A plugin uses Hubra and its own code only, never another plugin's:
      # the other plugin may be missing, switched off or on another version.
      # Talk to other areas through Hubra's API and slots instead.
      - name: No imports from other plugins
        run: |
          python3 - <<'PY'
          import ast, pathlib, re, sys
          root = pathlib.Path("plugin")
          text = (root / "plugin.yaml").read_text()
          own = re.search(r"^package:\s*[\"']?([\w]+)", text, re.M).group(1)
          bad = []
          for f in sorted(root.rglob("*.py")):
              if ".git" in f.parts or "node_modules" in f.parts:
                  continue
              for node in ast.walk(ast.parse(f.read_text(), str(f))):
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and not node.level:
                      names = [node.module or ""]
                  else:
                      continue
                  for name in names:
                      top = name.split(".")[0]
                      # hubra_<x> is another plugin's package; hubra.plugins
                      # and plugin modules moved out of core count too.
                      if (top.startswith("hubra_") and top != own) or name.startswith("hubra.plugins."):
                          bad.append(f"{f.relative_to(root)}:{node.lineno}: {name}")
          src = root / "frontend" / "src"
          for f in sorted(src.rglob("*.ts*")) if src.is_dir() else []:
              for n, line in enumerate(f.read_text().splitlines(), 1):
                  m = re.search(r"""(?:from|import)\s*\(?\s*['"]([^'"]+)['"]""", line)
                  if not m:
                      continue
                  spec = m.group(1)
                  resolved = (f.parent / spec).resolve() if spec.startswith(".") else None
                  if (resolved and src.resolve() not in resolved.parents and resolved != src.resolve()) \
                          or re.match(r"@hubra/(?!plugin-sdk$)|hubra-plugin-", spec):
                      bad.append(f"{f.relative_to(root)}:{n}: {spec}")
          for b in bad:
              print(f"::error::import from outside this plugin: {b}")
          if bad:
              sys.exit("A plugin may import Hubra (hubra.*, @hubra/plugin-sdk) and its own code only.")
          print("No imports from other plugins.")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hubra-app/hubra
          path: hubra
          token: ${{ secrets.HUBRA_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hubra/app/backend/requirements.lock
      - run: pip install --no-deps -r hubra/app/backend/requirements.lock
      - run: pip install pytest pytest-flask
      # A plugin that uses another plugin's area is an add-on of it: Hubra
      # shows it under that plugin and checks the version on every install
      # and update. So the manifest has to say so: every other module the
      # plugin builds on (its module codes like inventory.keys, the slots it
      # fills like inventory.item) under requires:, and every plugin those
      # come from under depends: with a version range.
      - name: The manifest declares every dependency
        run: |
          python - <<'PY'
          import pathlib, re, sys
          import yaml
          from packaging.specifiers import InvalidSpecifier, SpecifierSet
          root = pathlib.Path("plugin")
          m = yaml.safe_load((root / "plugin.yaml").read_text()) or {}
          pid = str(m.get("id", ""))
          own = [str(c) for c in m.get("modules") or []]
          requires = [str(c) for c in m.get("requires") or []]
          depends = m.get("depends") or {}
          if not isinstance(depends, dict):
              sys.exit("::error::depends: a mapping of plugin id to version range")
          # What Hubra itself provides: its modules and the slots its app has.
          core = set()
          for f in pathlib.Path("hubra/app/backend/hubra/modules").glob("*.py"):
              core.update(re.findall(r'\bcode="([a-z][a-z0-9_.]*)"', f.read_text()))
          slots = set()
          for f in pathlib.Path("hubra/app/frontend/src").rglob("*.tsx"):
              if ".test." in f.name:
                  continue
              slots.update(re.findall(r'<PluginSlot\s+name="([a-z][a-z0-9_.]*)"', f.read_text()))
          area = lambda code: code.split(".")[0]
          mine = {area(c) for c in own if "." not in c} | {pid}
          used = {}  # area -> where it is used
          for c in own:
              if "." in c and area(c) not in mine:
                  used.setdefault(area(c), f"module {c}")
          src = root / "frontend" / "src"
          for f in sorted(src.rglob("*.ts*")) if src.is_dir() else []:
              for s in re.findall(r"""\bslot:\s*['"]([a-z][a-z0-9_.]*)['"]""", f.read_text()):
                  if s not in slots and area(s) not in mine and area(s) not in core:
                      used.setdefault(area(s), f"slot {s} in {f.relative_to(root)}")
          bad = []
          for a, where in sorted(used.items()):
              if not any(r == a or r.startswith(a + ".") for r in requires):
                  bad.append(f"uses {a} ({where}) but requires: doesn't list it")
          for r in requires:
              if r in core or area(r) in mine:
                  continue
              rng = depends.get(area(r))
              if rng in (None, ""):
                  bad.append(
                      f"requires {r}, which the plugin {area(r)} provides: name it under "
                      f'depends: with a version range, e.g. depends: {{{area(r)}: ">=2.0,<3"}}'
                  )
          for d, rng in depends.items():
              try:
                  SpecifierSet(str(rng or ""))
              except InvalidSpecifier:
                  bad.append(f"depends: {d}: '{rng}' isn't a version range like '>=2.0,<3'")
              if not str(rng or "").strip():
                  bad.append(f"depends: {d} has no version range")
          for b in bad:
              print(f"::error file=plugin.yaml::{b}")
          if bad:
              sys.exit("Declare every plugin this one builds on (docs/plugins.md, Add-ons in hubra-app/hubra).")
          print("Dependencies declared:", ", ".join(f"{d} {r}" for d, r in depends.items()) or "only Hubra")
          PY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hubra/app/frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: hubra/app/frontend

      - name: Test against Hubra
        working-directory: hubra/app/backend
        env:
          ID: ${{ steps.manifest.outputs.id }}
        run: |
          rm -rf "../../plugins/$ID" && cp -r "$GITHUB_WORKSPACE/plugin" "../../plugins/$ID"
          # Plugins it builds on (requires: or depends: naming another
          # official plugin, e.g. inventory) are tested with it, from main.
          deps=$(python -c 'import sys, yaml; m = yaml.safe_load(open(sys.argv[1])); print(*(m.get("requires") or []), *(m.get("depends") or {}))' "../../plugins/$ID/plugin.yaml")
          for dep in $deps; do
            if [ "$dep" != "$ID" ] && [ ! -d "../../plugins/$dep" ]; then
              GIT_TERMINAL_PROMPT=0 git clone -q --depth 1 "https://github.com/hubra-app/hubra-plugin-$dep" "../../plugins/$dep" 2>/dev/null \
                && echo "Testing with the $dep plugin" || true
            fi
          done
          (cd ../frontend && npm run typecheck:plugins)
          if [ -d "../../plugins/$ID/tests" ]; then pytest -q "../../plugins/$ID"; fi

      - name: Build the frontend
        if: github.ref_type == 'tag'
        working-directory: hubra/app/frontend
        env:
          ID: ${{ steps.manifest.outputs.id }}
        run: npm run build:plugin -- "../../plugins/$ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: frontend
          path: hubra/plugins/${{ steps.manifest.outputs.id }}/frontend/dist/
          if-no-files-found: ignore
          retention-days: 1

  sign:
    needs: test
    # Never sign the template itself, only plugins made from it.
    if: github.ref_type == 'tag' && !github.event.repository.is_template
    runs-on: ubuntu-24.04
    environment: plugin-signing
    steps:
      # The plugin straight from git, Hubra's backend and nothing npm touched
      # but the built frontend.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hubra-app/hubra
          path: hubra
          sparse-checkout: app/backend
          token: ${{ secrets.HUBRA_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend
          path: ${{ runner.temp }}/frontend
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install --no-deps -r hubra/app/backend/requirements.lock

      - name: Sign and pack
        working-directory: hubra/app/backend
        env:
          FLASK_APP: "hubra:create_app()"
          SIGNING_KEY: ${{ secrets.HUBRA_SIGNING_KEY }}
          SIGNER: ${{ vars.HUBRA_SIGNER || 'Hubra' }}
          ID: ${{ needs.test.outputs.id }}
          VER: ${{ needs.test.outputs.version }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then echo "::error::add HUBRA_SIGNING_KEY to the plugin-signing environment"; exit 1; fi
          out="$GITHUB_WORKSPACE/build/$ID"
          mkdir -p "$out" && git -C "$GITHUB_WORKSPACE/plugin" archive HEAD | tar -x -C "$out"  # what's committed
          if [ -d "$RUNNER_TEMP/frontend" ]; then
            rm -rf "$out/frontend/dist" && mkdir -p "$out/frontend" && cp -R "$RUNNER_TEMP/frontend" "$out/frontend/dist"
          fi
          flask plugins prune "$out"  # minus what .releaseignore lists
          key="$RUNNER_TEMP/key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          # Refuse to sign with any key but the official one.
          python - "$key" <<'PY'
          import sys
          from cryptography.hazmat.primitives import serialization
          from hubra.core.plugins.trust import OFFICIAL_DIR, key_id, load_public
          pub = serialization.load_pem_private_key(open(sys.argv[1], "rb").read(), None).public_key()
          official = load_public((OFFICIAL_DIR / "Hubra.pub").read_text())
          if key_id(pub) != key_id(official):
              sys.exit(f"HUBRA_SIGNING_KEY is {key_id(pub)}, not the official key {key_id(official)}")
          PY
          flask plugins sign "$out" --key "$key" --signer "$SIGNER"
          flask plugins pack "$out" -o "$GITHUB_WORKSPACE/$ID-$VER.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: ${{ needs.test.outputs.id }}-${{ needs.test.outputs.version }}.zip
          retention-days: 1

  release:
    needs: [test, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      ID: ${{ needs.test.outputs.id }}
      VER: ${{ needs.test.outputs.version }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
      - name: Release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What a draft release made for this tag already says stays on top.
          BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,body \
                 -q 'select(.isDraft) | .body' 2>/dev/null || true)
          export BODY
          python3 - <<'PY'
          import os, re
          v = os.environ["VER"]
          log = open("CHANGELOG.md").read() if os.path.exists("CHANGELOG.md") else ""
          m = re.search(rf"^##+\s*\[?v?{re.escape(v)}\]?\b[^\n]*\n(.*?)(?=^##+\s|\Z)", log, re.M | re.S)
          section = m.group(1).strip() if m else ""
          body = os.environ.get("BODY", "").strip()
          parts = [body] if body else []
          if section and section not in body:
              parts.append(f"## Changes in {v}\n\n{section}" if body else section)
          open("notes.md", "w").write("\n\n".join(parts) or f"{os.environ['ID']} {v}")
          PY
      - name: Checksum
        run: |
          sha256sum "$ID-$VER.zip" > "$ID-$VER.zip.sha256"
          printf '\n\nSHA-256 of `%s`: `%s`\n' "$ID-$VER.zip" "$(cut -d' ' -f1 "$ID-$VER.zip.sha256")" >> notes.md
      - name: Publish the release with the signed plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An immutable release takes no files once published, so it is
          # published complete: created with the zip, or a draft filled first.
          files=("$ID-$VER.zip" "$ID-$VER.zip.sha256")
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo none)
          case "$draft" in
            none)
              gh release create "$TAG" "${files[@]}" --verify-tag --title "$TAG" \
                --notes-file notes.md --repo "$GITHUB_REPOSITORY" ;;
            true)
              gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
              gh release edit "$TAG" --notes-file notes.md --draft=false --repo "$GITHUB_REPOSITORY" ;;
            *)
              echo "::error::release $TAG is already published; bump the version and push a new tag"
              exit 1 ;;
          esac
      - name: Tell the Marketplace
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
          MARKETPLACE: ${{ vars.MARKETPLACE_REPO || 'hubra-app/hubra-plugins' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "No MARKETPLACE_TOKEN: the Marketplace picks it up within the hour."; exit 0; fi
          gh api "repos/$MARKETPLACE/dispatches" -f event_type=plugin-released
